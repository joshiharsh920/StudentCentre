_schema-version: 3.3.0
ID: CentralStudentCentre
description: Central Student Centre CAP application
version: 1.0.7

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # CAP service
  - name: CentralStudentCentre-srv
    type: nodejs
    path: gen/srv

    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 256M
      disk-quota: 512M

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: CentralStudentCentre-db
      - name: CentralStudentCentre-auth
      - name: CentralStudentCentre-destination

  # HANA database deployer
  - name: CentralStudentCentre-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: CentralStudentCentre-db

  # UI5 application deployed as a standalone Node.js application
  - name: CentralStudentCentre-ui
    type: nodejs
    path: app/centralstudentcentre

    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 256M
      disk-quota: 512M

    provides:
      - name: ui-api
        properties:
          ui-url: ${default-url}

    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: true

      - name: CentralStudentCentre-auth

    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:cf

resources:
  # HANA HDI container
  - name: CentralStudentCentre-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared

  # Authentication shared by the UI and CAP service
  - name: CentralStudentCentre-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: CentralStudentCentre-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://03736cd4trial-dev-centralstudentcentre-ui.cfapps.us10-001.hana.ondemand.com/**

  - name: CentralStudentCentre-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite