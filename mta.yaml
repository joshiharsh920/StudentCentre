_schema-version: 3.3.0
ID: CentralStudentCentre
version: 1.0.0
description: Central Student Centre CAP application

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: CentralStudentCentre-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: CentralStudentCentre-db

  - name: CentralStudentCentre-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: CentralStudentCentre-db

  - name: CentralStudentCentre-ui
    type: html5
    path: app/centralstudentcentre
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: CentralStudentCentre-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: CentralStudentCentre-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: CentralStudentCentre-ui
          artifacts:
            - centralstudentcentre.zip
          target-path: resources/

  - name: CentralStudentCentre-destination-content
    type: com.sap.application.content
    requires:
      - name: CentralStudentCentre-destination
        parameters:
          content-target: true
      - name: CentralStudentCentre-html5-repo-host
        parameters:
          service-key:
            name: CentralStudentCentre-html5-repo-host-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: CentralStudentCentre-html5-repo-host
              ServiceInstanceName: CentralStudentCentre-html5-repo-host
              ServiceKeyName: CentralStudentCentre-html5-repo-host-key
              sap.cloud.service: centralstudentcentre
            - Name: srv-api
              URL: ~{srv-api/srv-url}
              Authentication: NoAuthentication
              ProxyType: Internet
              Type: HTTP
              HTML5.DynamicDestination: true
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: CentralStudentCentre-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: CentralStudentCentre-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: CentralStudentCentre-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
