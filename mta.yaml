_schema-version: 3.3.0
ID: CentralStudentCentre
description: Central Student Centre CAP application
version: 1.0.1
modules:
- name: CentralStudentCentre-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: CentralStudentCentre-db
  - name: CentralStudentCentre-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: CentralStudentCentre-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: CentralStudentCentre-db
  parameters:
    buildpack: nodejs_buildpack
- name: centralstudentcentre
  type: html5
  path: app/centralstudentcentre
  build-parameters:
    _artifactName: centralstudentcentre.zip
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: CentralStudentCentre-app-content
  type: com.sap.application.content
  path: gen
  requires:
  - name: CentralStudentCentre-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - centralstudentcentre.zip
      name: centralstudentcentre
      target-path: app/
- name: CentralStudentCentre-destination-content
  type: com.sap.application.content
  requires:
  - name: CentralStudentCentre-destination
    parameters:
      content-target: true
  - name: CentralStudentCentre-html5-repo-host
    parameters:
      service-key:
        name: CentralStudentCentre-html5-repo-host-key
  parameters:
    content:
      instance:
        destinations:
        - Name: CentralStudentCentre-html5-repo-host
          ServiceInstanceName: CentralStudentCentre-html5-repo-host
          ServiceKeyName: CentralStudentCentre-html5-repo-host-key
          sap.cloud.service: centralstudentcentre
        existing_destinations_policy: update
  build-parameters:
    no-source: true
resources:
- name: CentralStudentCentre-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: CentralStudentCentre-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: CentralStudentCentre-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
    group: destinations
    properties:
      name: srv-api
      url: ~{srv-url}
      forwardAuthToken: true
      HTML5.DynamicDestination: true
      HTML5.ForwardAuthToken: true
- name: CentralStudentCentre-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: CentralStudentCentre-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
